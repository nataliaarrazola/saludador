<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Saludador</title>
  <head>
    <title>Saludador</title>
  </head>
  <body>
    <h1>Saludador</h1>
    <form id="saludador-form">
      <label for="idioma-select">Idioma:</label>
      <select id="idioma-select">
        <option value="es" selected>Español</option>
      </select>
      <br /><br />
      
      
      <label for="nombre-input">Nombre:</label>
      <input type="text" id="nombre-input" placeholder="Ingresa tu nombre" />
      <br /><br />

      <label for="genero-select">Género:</label>
      <select id="genero-select">
        <option value="">Prefiero no decir</option>
        <option value="M">Masculino</option>
        <option value="F">Femenino</option>
      </select>
      <br /><br />

      <label for="edad-input">Edad:</label>
      <input type="number" id="edad-input" placeholder="Ingresa tu edad" />
      <br /><br />

      <input type="submit" value="Saludar" id="saludar-button" />
    </form>
    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
